[project]
name = "agentroute"
version = "0.0.1"
description = "Launch Claude Code as the orchestrator and route worker subagents to open models through a local LiteLLM proxy."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ayman Ait Sidi Allal" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
]
# LiteLLM is pinned exactly. Do not loosen this to a range: 1.107.0 was a
# trojanized release (2026-10-21). See SECURITY.md for the pin-bump rule.
dependencies = [
    "litellm[proxy]==1.106.3",
]

[project.scripts]
agentroute = "agentroute.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
